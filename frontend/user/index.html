<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalConnect — Client Portal (Coming Soon)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <style>
      :root {
        --color-primary: #1a2744;
        --color-accent: #0d9488;
        --color-accent-lighter: #5eead4;
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.15);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 600px at 80% -10%, rgba(13,148,136,.25), transparent 60%),
          radial-gradient(900px 500px at 10% 110%, rgba(26,39,68,.9), transparent 60%),
          linear-gradient(160deg, #111b30 0%, #1a2744 55%, #16223c 100%);
        color: #fff;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: var(--glass-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        border-radius: 28px;
        padding: clamp(32px, 6vw, 56px) clamp(20px, 5vw, 48px);
        box-shadow: 0 24px 60px rgba(0,0,0,.35);
      }
      .logo {
        width: 64px; height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
        box-shadow: 0 12px 30px rgba(13,148,136,.35);
      }
      .logo .material-symbols-rounded { font-size: 34px; color: #fff; }
      h1 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; letter-spacing: -0.02em; }
      h1 span {
        background: linear-gradient(90deg, var(--color-accent-lighter), var(--color-accent));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        margin: 16px 0 12px;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: .78rem; font-weight: 600;
        background: rgba(13,148,136,.16);
        border: 1px solid rgba(94,234,212,.25);
        color: var(--color-accent-lighter);
      }
      p.desc { color: rgba(255,255,255,.72); line-height: 1.65; font-size: .95rem; margin-bottom: 28px; }
      .btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 13px 28px;
        border-radius: 999px;
        font-weight: 600; font-size: .92rem;
        color: #fff; text-decoration: none;
        background: linear-gradient(135deg, var(--color-accent), #0a7a70);
        box-shadow: 0 10px 24px rgba(13,148,136,.4);
        transition: transform .18s ease, box-shadow .18s ease;
      }
      .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(13,148,136,.5); }
      .btn .material-symbols-rounded { font-size: 19px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo"><span class="material-symbols-rounded">balance</span></div>
        <h1>Legal<span>Connect</span></h1>
        <div class="badge"><span class="material-symbols-rounded" style="font-size:16px">schedule</span> Client Portal · Coming Soon</div>
        <p class="desc">
            We're building the destination for finding verified advocates, AI-assisted legal
            guidance and virtual court simulations. The Advocate Portal is fully live today.
        </p>
        <a class="btn" href="/frontend/lawyer/index.html#/role-select">
            <span class="material-symbols-rounded">gavel</span> Continue as Advocate
        </a>
    </main>
</body>
</html>
